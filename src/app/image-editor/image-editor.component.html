<div class="container">
  <input type="file" (change)="onFilesChange($event)" multiple />

  <div class="logo-selection">
    <button (click)="selectLogo('blanc')" [ngClass]="{ 'selected': selectedLogo === 'blanc' }">
      Logo Blanc
    </button>
    <button (click)="selectLogo('noir')" [ngClass]="{ 'selected': selectedLogo === 'noir' }">
      Logo Noir
    </button>
  </div>

  <div class="logo-options">
    <label>
      <input type="checkbox" [(ngModel)]="addLogoLeft" />
      Ajouter logo gauche
    </label>
    <label>
      <input type="checkbox" [(ngModel)]="addLogoRight" />
      Ajouter logo droit
    </label>
  </div>

  <button (click)="downloadImages()">Télécharger les images</button>
  <canvas #canvas></canvas>

  <div *ngIf="loading" class="progress">
    Progression : {{ progress }} sur {{ totalImages }}
  </div>
</div>
